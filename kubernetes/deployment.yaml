apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: devops-nginx:jenkins   # initial placeholder
        imagePullPolicy: Always       # always pull latest image
        ports:
        - containerPort: 80