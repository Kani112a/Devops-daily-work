<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps with Docker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1d2671, #c33764);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.12);
            padding: 40px 50px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 420px;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 28px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            opacity: 0.95;
        }

        .tag {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            background: #ffffff;
            color: #1d2671;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🚀 Hello from Docker</h1>
        <p>
            This application is running inside a Docker container.<br>
            Welcome to my <strong>DevOps learning journey</strong> 🚀
        </p>
        <div class="tag">Docker • Jenkins • GitHub • DevOps</div>
    </div>

</body>
</html>
